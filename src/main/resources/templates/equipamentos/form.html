<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipamento · TechOS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../static/css/techos.css" th:href="@{/css/techos.css}">
</head>
<body>

<!-- MENU (igual em todas as telas) -->
<nav class="navbar navbar-expand-lg navbar-techos sticky-top" data-bs-theme="dark">
  <div class="container-xl">
    <a class="navbar-brand" href="#" th:href="@{/}"><span class="brand-mark">T</span>TechOS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-lg-3">
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/}">Painel</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/clientes}">Clientes</a></li>
        <li class="nav-item"><a class="nav-link active" href="#" th:href="@{/equipamentos}">Equipamentos</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/os}">Ordens de serviço</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- AVISOS (só aparecem se o Controller mandar "mensagem" ou "erro") -->
<div class="container-xl pt-3">
  <div class="alert alert-success mb-0" th:if="${mensagem != null}" th:text="${mensagem}">Salvo com sucesso.</div>
  <div class="alert alert-danger mb-0" th:if="${erro != null}" th:text="${erro}">Algo deu errado.</div>
</div>

<!-- CONTEÚDO DA TELA -->
<main class="container-xl py-4">

  <div class="page-head">
    <h1 class="h3" th:text="${equipamento.id == null} ? 'Novo equipamento' : 'Editar equipamento'">Novo equipamento</h1>
  </div>

  <div class="panel" style="max-width:640px">
    <form class="panel-body" method="post" th:action="@{/equipamentos/salvar}" th:object="${equipamento}" novalidate>
      <input type="hidden" th:field="*{id}">

      <div class="mb-3">
        <label class="form-label" for="cliente">Cliente</label>
        <!-- name="cliente.id": o Spring monta o Cliente só com o id -->
        <select id="cliente" name="cliente.id" class="form-select" required>
          <option value="">Escolha o cliente</option>
          <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"
                  th:selected="${equipamento.cliente != null and equipamento.cliente.id == c.id}">Maria Souza</option>
        </select>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-12 col-sm-5">
          <label class="form-label" for="tipo">Tipo</label>
          <select id="tipo" class="form-select" th:field="*{tipo}">
            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}">NOTEBOOK</option>
          </select>
        </div>
        <div class="col-12 col-sm-7">
          <label class="form-label" for="marca">Marca</label>
          <input type="text" id="marca" class="form-control" th:field="*{marca}" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:errors="*{marca}">Informe a marca.</div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6">
          <label class="form-label" for="modelo">Modelo</label>
          <input type="text" id="modelo" class="form-control" th:field="*{modelo}" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:errors="*{modelo}">Informe o modelo.</div>
        </div>
        <div class="col-12 col-sm-6">
          <label class="form-label" for="numeroSerie">Número de série</label>
          <input type="text" id="numeroSerie" class="form-control" th:field="*{numeroSerie}">
        </div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Salvar equipamento</button>
        <a class="btn btn-outline-secondary" th:href="@{/equipamentos}">Cancelar</a>
      </div>
    </form>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
