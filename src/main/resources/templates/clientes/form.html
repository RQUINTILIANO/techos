<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cliente · TechOS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../static/css/techos.css" th:href="@{/css/techos.css}">
</head>
<body>

<!-- MENU (igual em todas as telas) -->
<nav class="navbar navbar-expand-lg navbar-techos sticky-top" data-bs-theme="dark">
  <div class="container-xl">
    <a class="navbar-brand" href="#" th:href="@{/}"><span class="brand-mark">T</span>TechOS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-lg-3">
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/}">Painel</a></li>
        <li class="nav-item"><a class="nav-link active" href="#" th:href="@{/clientes}">Clientes</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/equipamentos}">Equipamentos</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/os}">Ordens de serviço</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- AVISOS (só aparecem se o Controller mandar "mensagem" ou "erro") -->
<div class="container-xl pt-3">
  <div class="alert alert-success mb-0" th:if="${mensagem != null}" th:text="${mensagem}">Salvo com sucesso.</div>
  <div class="alert alert-danger mb-0" th:if="${erro != null}" th:text="${erro}">Algo deu errado.</div>
</div>

<!-- CONTEÚDO DA TELA -->
<main class="container-xl py-4">

  <div class="page-head">
    <h1 class="h3" th:text="${cliente.id == null} ? 'Novo cliente' : 'Editar cliente'">Novo cliente</h1>
  </div>

  <div class="panel" style="max-width:640px">
    <form class="panel-body" method="post" th:action="@{/clientes/salvar}" th:object="${cliente}" novalidate>
      <input type="hidden" th:field="*{id}">

      <div class="mb-3">
        <label class="form-label" for="nome">Nome</label>
        <input type="text" id="nome" class="form-control" th:field="*{nome}" th:errorclass="is-invalid" autofocus>
        <div class="invalid-feedback" th:errors="*{nome}">Informe o nome.</div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-12 col-sm-5">
          <label class="form-label" for="telefone">Telefone</label>
          <input type="tel" id="telefone" class="form-control" th:field="*{telefone}" th:errorclass="is-invalid" placeholder="(11) 99999-0000">
          <div class="invalid-feedback" th:errors="*{telefone}">Informe o telefone.</div>
        </div>
        <div class="col-12 col-sm-7">
          <label class="form-label" for="email">E-mail</label>
          <input type="email" id="email" class="form-control" th:field="*{email}" th:errorclass="is-invalid">
          <div class="invalid-feedback" th:errors="*{email}">Informe um e-mail válido.</div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Salvar cliente</button>
        <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
      </div>
    </form>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
