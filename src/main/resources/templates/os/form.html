<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova ordem de serviço · TechOS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../static/css/techos.css" th:href="@{/css/techos.css}">
</head>
<body>

<!-- MENU (igual em todas as telas) -->
<nav class="navbar navbar-expand-lg navbar-techos sticky-top" data-bs-theme="dark">
  <div class="container-xl">
    <a class="navbar-brand" href="#" th:href="@{/}"><span class="brand-mark">T</span>TechOS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-lg-3">
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/}">Painel</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/clientes}">Clientes</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/equipamentos}">Equipamentos</a></li>
        <li class="nav-item"><a class="nav-link active" href="#" th:href="@{/os}">Ordens de serviço</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- AVISOS (só aparecem se o Controller mandar "mensagem" ou "erro") -->
<div class="container-xl pt-3">
  <div class="alert alert-success mb-0" th:if="${mensagem != null}" th:text="${mensagem}">Salvo com sucesso.</div>
  <div class="alert alert-danger mb-0" th:if="${erro != null}" th:text="${erro}">Algo deu errado.</div>
</div>

<!-- CONTEÚDO DA TELA -->
<main class="container-xl py-4">

  <div class="page-head">
    <h1 class="h3">Nova ordem de serviço</h1>
  </div>

  <div class="panel" style="max-width:640px">
    <form class="panel-body" method="post" th:action="@{/os/salvar}" th:object="${ordemServico}" novalidate>

      <div class="mb-3">
        <label class="form-label" for="equipamento">Equipamento</label>
        <select id="equipamento" name="equipamento.id" class="form-select" required>
          <option value="">Escolha o equipamento</option>
          <option th:each="e : ${equipamentos}" th:value="${e.id}"
                  th:text="${e.tipo} + ' ' + ${e.marca} + ' ' + ${e.modelo} + ' — ' + ${e.cliente.nome}">NOTEBOOK Dell Inspiron — Maria</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label" for="defeito">Defeito relatado</label>
        <textarea id="defeito" rows="4" class="form-control" th:field="*{defeito}" th:errorclass="is-invalid"
                  placeholder="O que o cliente disse que está acontecendo?"></textarea>
        <div class="invalid-feedback" th:errors="*{defeito}">Descreva o defeito.</div>
        <div class="form-text">A data de entrada e o status inicial (Recebido) são preenchidos automaticamente.</div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Abrir ordem de serviço</button>
        <a class="btn btn-outline-secondary" th:href="@{/os}">Cancelar</a>
      </div>
    </form>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
