<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Algo deu errado · TechOS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/techos.css" th:href="@{/css/techos.css}">
</head>
<body>

<!-- MENU (igual em todas as telas) -->
<nav class="navbar navbar-expand-lg navbar-techos sticky-top" data-bs-theme="dark">
  <div class="container-xl">
    <a class="navbar-brand" href="#" th:href="@{/}"><span class="brand-mark">T</span>TechOS</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-label="Abrir menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menuPrincipal">
      <ul class="navbar-nav ms-lg-3">
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/}">Painel</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/clientes}">Clientes</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/equipamentos}">Equipamentos</a></li>
        <li class="nav-item"><a class="nav-link" href="#" th:href="@{/os}">Ordens de serviço</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- AVISOS (só aparecem se o Controller mandar "mensagem" ou "erro") -->
<div class="container-xl pt-3">
  <div class="alert alert-success mb-0" th:if="${mensagem != null}" th:text="${mensagem}">Salvo com sucesso.</div>
  <div class="alert alert-danger mb-0" th:if="${erro != null}" th:text="${erro}">Algo deu errado.</div>
</div>

<!-- CONTEÚDO DA TELA -->
<main class="container-xl py-5">
  <div class="panel" style="max-width:560px">
    <div class="panel-body">
      <h1 class="h4">Não foi possível abrir esta página</h1>
      <p class="text-secondary mb-1" th:if="${status != null}" th:text="'Código ' + ${status}">Código 404</p>
      <p class="mb-4">Confira o endereço ou volte para o painel e tente de novo.</p>
      <a class="btn btn-primary" th:href="@{/}">Voltar ao painel</a>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
