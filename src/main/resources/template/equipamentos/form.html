<!DOCTYPE html>
<html lang="pt-br">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <meta name="keywords" content="">
    <title>Painel TechOS</title>
    <link rel="shortcut icon" href="../img/letra-tt.png" type="image/x-icon">
 
    <!--Bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--CSS interno-->
    <link rel="stylesheet" href="../../static/css/style.css">
</head>
 
<body>
    <!-- MENU - IGUAL EM TODAS AS PAGINAS -->
    <div class="container-fluid">
        <nav class="navbar navbar-expand-lg bg-dark sticky-top" data-bs-theme="dark">
            <div class="container">
 
                <a class="navbar-brand" href="#">
                    <img src="../img/letra-t.png" alt="">
                </a>
 
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link " aria-current="page"
                                href="#">Painel</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Clientes</a>
                        </li>
 
                        <li class="nav-item active border-bottom border-success">
                            <a class="nav-link" href="#">Equipamentos</a>
                        </li>
 
                        <li class="nav-item">
                            <a class="nav-link" href="#">Ordem de Serviços</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
 
    <!--Avisos-->
    <div class="container mt-3">
        <div class="alert alert-success" role="alert">
            Salvo com sucesso!
        </div>
        <div class="alert alert-danger" role="alert">
            Algo deu errado!
        </div>
    </div>
 
    <!--Conteúdo-->
    <main class="container">
        <!-- CSS interno - page-header -->
        <div class="page-header">
            <h1 class="h3">Novo Equipamento</h1>
        </div>
        <!-- CSS interno - panel, panel-body -->
        <div class="panel px-3 py-3" style="max-width: 640px;">
            <form class="panel-body" method="post">
 
                <input type="hidden">
 
                <div class="mb-3">
                    <label class="form-label" for="cliente">Cliente</label>
                    <select name="cliente.id" id="cliente" class="form-select" required>
                        <option value="">Escolha o cliente</option>
                        <option value="">João e Maria</option>
                    </select>
                </div>
 
                <div class="row mb-4 g-3">
                    <div class="col-12 col-sm-5">
                        <label for="tipo" class="form-label">Tipo</label>
                       
                        <select id="tipo" class="form-select">
                            <option value="">Notebook</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-7">
                        <label for="marca" class="form-label">Marca</label>
                        <input type="text" class="form-control" id="marca">
                        <div class="invalid-feedback">
                            informe a marca.
                        </div>
                    </div>
                </div>
 
                <div class="row mb-4 g-3">
                    <div class="col-12 col-sm-6">
                        <label for="modelo" class="form-label">Modelo</label>
                        <input type="text" class="form-control" id="modelo">
                        <div class="invalid-feedback">
                            informe o modelo.
                        </div>
                    </div>
 
                    <div class="col-12 col-sm-6">
                        <label for="numeroSerie" class="form-label">Número de série</label>
                        <input type="text" class="form-control" id="numeroSerie">
                    </div>
                </div>
 
                <div class="d-flex gap-2">
                    <button class="btn btn-success" type="submit">Salvar equipamento</button>
                    <a href="" class="btn btn-outline-secondary">Cancelar</a>
                </div>
 
            </form>
        </div>
 
 
    </main>
 
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
 
 
</html>
